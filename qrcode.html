<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StrideClash - Install Mobile App</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
    background: #0A0A14; 
    color: #FFFFFF; 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
    padding: 24px;
  }
  .card { 
    text-align: center; 
    background: #121220; 
    padding: 36px 32px; 
    border-radius: 24px; 
    border: 1px solid rgba(255, 255, 255, 0.1); 
    box-shadow: 0 16px 48px rgba(0, 191, 255, 0.18); 
    max-width: 480px; 
    width: 100%;
  }
  .title-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  h1 { 
    color: #00BFFF; 
    font-size: 26px; 
    font-weight: 800; 
    letter-spacing: -0.5px;
  }
  .subtitle { 
    color: #8A8AAB; 
    font-size: 14px; 
    margin-bottom: 24px; 
    line-height: 1.4;
  }

  /* Tabs */
  .tabs {
    display: flex;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 24px;
    gap: 4px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px 14px;
    border: none;
    background: transparent;
    color: #8A8AAB;
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .tab-btn.active {
    background: #00BFFF;
    color: #0A0A14;
    box-shadow: 0 2px 8px rgba(0, 191, 255, 0.4);
  }

  /* QR Box */
  .qr-wrapper {
    background: #FFFFFF; 
    padding: 18px; 
    border-radius: 18px; 
    display: inline-block; 
    box-shadow: 0 8px 24px rgba(0,0,0,0.4); 
    margin-bottom: 20px;
  }
  .qr-wrapper img {
    display: block;
  }

  .instructions-box {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    padding: 16px;
    text-align: left;
    margin-bottom: 20px;
  }
  .instructions-box ol {
    padding-left: 20px;
    color: #CCCCE0;
    font-size: 13px;
    line-height: 1.6;
  }
  .instructions-box li {
    margin-bottom: 4px;
  }

  .action-btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #00BFFF 0%, #0080FF 100%);
    color: #FFFFFF;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0, 191, 255, 0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .action-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(0, 191, 255, 0.45);
  }

  .url-label {
    font-size: 11px;
    color: #6A6A8A;
    margin-top: 14px;
    word-break: break-all;
    font-family: ui-monospace, SFMono-Regular, monospace;
  }
</style>
</head>
<body>

<div class="card">
  <div class="title-row">
    <span style="font-size: 24px;">⚡</span>
    <h1>StrideClash Mobile</h1>
  </div>
  <p class="subtitle" id="subtitle-text">Scan the QR code below using your phone camera</p>

  <!-- Navigation Tabs -->
  <div class="tabs">
    <button class="tab-btn active" id="tab-apk" onclick="switchMode('apk')">
      🌐 Direct APK (Public / 4G / 5G)
    </button>
    <button class="tab-btn" id="tab-wifi" onclick="switchMode('wifi')">
      📶 Direct APK (Local Wi-Fi)
    </button>
    <button class="tab-btn" id="tab-metro" onclick="switchMode('metro')">
      ⚡ Live Expo Go
    </button>
  </div>

  <!-- QR Code Display -->
  <div class="qr-wrapper">
    <div id="qrcode"></div>
  </div>

  <!-- Instructions Container -->
  <div class="instructions-box" id="instructions">
    <!-- Populated by JS -->
  </div>

  <!-- Direct Link Button -->
  <a href="#" id="direct-link" target="_blank" class="action-btn">
    Open Download Page
  </a>

  <div class="url-label" id="url-text"></div>
</div>

<script>
  var PUBLIC_APK_URL = "https://cool-blair-show-brisbane.trycloudflare.com/download/strideclash.apk";
  var LOCAL_APK_URL = "http://192.168.29.185:3000/download/strideclash.apk";
  var METRO_URL = "exp://192.168.29.185:8081";

  function renderQR(data) {
    var qr = qrcode(0, 'M');
    qr.addData(data);
    qr.make();
    document.getElementById('qrcode').innerHTML = qr.createImgTag(5, 0);
  }

  function switchMode(mode) {
    var tabApk = document.getElementById('tab-apk');
    var tabWifi = document.getElementById('tab-wifi');
    var tabMetro = document.getElementById('tab-metro');
    var inst = document.getElementById('instructions');
    var btn = document.getElementById('direct-link');
    var urlText = document.getElementById('url-text');
    var subtitle = document.getElementById('subtitle-text');

    tabApk.classList.remove('active');
    tabWifi.classList.remove('active');
    tabMetro.classList.remove('active');

    if (mode === 'apk') {
      tabApk.classList.add('active');
      subtitle.innerHTML = 'Scan with your <b>regular Phone Camera</b> or Google Lens (Works on Cellular / Any Network)';
      renderQR(PUBLIC_APK_URL);
      inst.innerHTML = `
        <ol>
          <li>Open your phone's <b>normal Camera</b> or Google Lens and scan the code.</li>
          <li>Tap the link to download <b>strideclash.apk (35.5 MB)</b> directly.</li>
          <li>Tap <b>"Open"</b> or <b>"Install"</b> (allow Install from Unknown Sources if prompted).</li>
          <li>Share this QR code or link with friends anywhere to test!</li>
        </ol>
      `;
      btn.innerText = 'Download Standalone APK (Public)';
      btn.href = PUBLIC_APK_URL;
      urlText.innerText = PUBLIC_APK_URL;
    } else if (mode === 'wifi') {
      tabWifi.classList.add('active');
      subtitle.innerHTML = 'Scan to download ultra-fast over your <b>local Wi-Fi network</b>';
      renderQR(LOCAL_APK_URL);
      inst.innerHTML = `
        <ol>
          <li>Ensure your phone is connected to the same Wi-Fi (<b>192.168.1.x</b>).</li>
          <li>Open your phone's <b>normal Camera</b> and scan the code.</li>
          <li>Tap the download link to instantly grab the 35.5 MB APK over high-speed LAN.</li>
          <li>Open and Install the APK on your device.</li>
        </ol>
      `;
      btn.innerText = 'Download Standalone APK (Local Wi-Fi)';
      btn.href = LOCAL_APK_URL;
      urlText.innerText = LOCAL_APK_URL;
    } else {
      tabMetro.classList.add('active');
      subtitle.innerHTML = 'Scan inside the <b>Expo Go</b> app on your phone';
      renderQR(METRO_URL);
      inst.innerHTML = `
        <ol>
          <li>Open the <b>Expo Go</b> app on your Android / iOS phone.</li>
          <li>Tap <b>"Scan QR code"</b> inside Expo Go.</li>
          <li>Ensure your phone is on the same Wi-Fi (<b>192.168.1.x</b>).</li>
        </ol>
      `;
      btn.innerText = 'Open Metro Developer Tools (localhost:8081)';
      btn.href = 'http://localhost:8081';
      urlText.innerText = METRO_URL;
    }
  }

  // Initialize with public APK mode by default
  switchMode('apk');
</script>

</body>
</html>
